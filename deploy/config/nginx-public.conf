# Public front (Cloudflare tunnel -> web): the home page at modeac.net, the live map at map.modeac.net.
# In the Cloudflare tunnel, route both hostnames (modeac.net and map.modeac.net) to http://web:80;
# this file tells them apart by name.
#
# 1. Privacy: the hub serves everything readsb writes, including the feeder lists (UUIDs and IP
#    addresses of every volunteer) used by the feeder check. Those, readsb's API and the stats
#    pages stay private.
# 2. Load: live aircraft data is marked cacheable for 1 second, so Cloudflare (with the Cache Rule
#    described in deploy/README.md) answers most visitors itself and your home upload carries about
#    one copy per second per Cloudflare location instead of one per visitor. A 1-second micro-cache
#    here also collapses simultaneous requests into one hit on the hub.

proxy_cache_path /var/cache/nginx/live levels=1 keys_zone=live:4m max_size=64m inactive=30s use_temp_path=off;

server {
    listen 80;
    server_name map.modeac.net map.*;
    server_tokens off;

    location ~ ^/data/(clients|receivers)\.json { return 404; }
    location ~ ^/(re-api|graphs1090|stats|status|api)(/|$) { return 404; }

    # live aircraft data: changes every second, identical for every visitor
    location /data/ {
        proxy_pass http://hub:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache live;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;                 # many visitors at once -> one request to the hub
        proxy_cache_use_stale updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=1" always;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://hub:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_hide_header X-Powered-By;
    }
}

# --- home page: modeac.net (and anything that isn't the map) --------------------------------------
server {
    listen 80 default_server;
    server_name modeac.net www.modeac.net _;
    server_tokens off;
    root /srv/site;
    index index.html;

    if ($host ~* ^www\.) { return 301 https://modeac.net$request_uri; }

    # network totals for the home page (counts only), refreshed by the feeder check every few minutes
    location = /stats.json {
        alias /srv/stats/public.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
    }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
    }
}
