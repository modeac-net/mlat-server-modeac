# Admin page (the "admin" service): feeder map + diagnostics, for you only.
# It shows feeders' exact locations and IP addresses: never point Cloudflare or the relay at it.
# Serves the page itself and exactly five read-only data files; nothing else.

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /data/mlat/clients.json        { alias /srv/mlat/clients.json; }
    location = /data/mlat/sync.json           { alias /srv/mlat/sync.json; }
    location = /data/feedercheck/status.json  { alias /srv/feedercheck/status.json; }
    location = /data/acfilter/status.json     { alias /srv/acfilter/status.json; }
    location = /data/hub/clients.json {
        proxy_pass http://hub:80/data/clients.json;
        proxy_http_version 1.1;
        proxy_hide_header Cache-Control;
    }
    location /data/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
